name: Deploy DocC tutorial to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "ARDominoChainReaction/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build bilingual tutorials and downloadable projects
        run: |
          python3 ARDominoChainReaction/Docs/Tools/build_tutorial_site.py \
            --output docs-output \
            --base-path 2026TechMap_tutorial \
            --package-apps

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
