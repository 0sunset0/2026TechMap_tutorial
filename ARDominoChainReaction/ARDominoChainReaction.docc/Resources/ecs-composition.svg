<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1670e8"/></marker></defs><rect width="1200" height="720" rx="24" fill="#fafcff"/><g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"><text x="56" y="72" font-size="34" fill="#172b4d" text-anchor="start">필요한 부품만 조합하기</text><text x="56" y="114" font-size="21" fill="#52677e" text-anchor="start">같은 Entity 구조라도 역할에 따라 컴포넌트 구성이 달라집니다.</text><rect x="55" y="195" width="530" height="370" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/><text x="77" y="237" font-size="25" fill="#172b4d" text-anchor="start">도미노</text><text x="77" y="277" font-size="20" fill="#455b75" text-anchor="start">ModelComponent: 모양 + 재질</text><text x="77" y="309" font-size="20" fill="#455b75" text-anchor="start">CollisionComponent: 충돌 범위</text><text x="77" y="341" font-size="20" fill="#455b75" text-anchor="start">PhysicsBodyComponent: dynamic</text><text x="77" y="373" font-size="20" fill="#455b75" text-anchor="start">보이고, 움직이며, 부딪힙니다.</text><rect x="615" y="195" width="530" height="370" rx="16" fill="#f0f8f3" stroke="#bfd0e5" stroke-width="2"/><text x="637" y="237" font-size="25" fill="#172b4d" text-anchor="start">보이지 않는 물리 바닥</text><text x="637" y="277" font-size="20" fill="#455b75" text-anchor="start">ModelComponent 없이 구성</text><text x="637" y="309" font-size="20" fill="#455b75" text-anchor="start">CollisionComponent: 충돌 범위</text><text x="637" y="341" font-size="20" fill="#455b75" text-anchor="start">PhysicsBodyComponent: static</text><text x="637" y="373" font-size="20" fill="#455b75" text-anchor="start">움직이지 않는 받침대입니다.</text></g></svg>