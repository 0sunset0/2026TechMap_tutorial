<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">필요한 부품만 조합하기</title>
  <desc id="desc">빨간 도미노에는 Model, Collision, dynamic PhysicsBody를 연결합니다. 점선으로 표시한 보이지 않는 바닥에는 Model 없이 Collision과 static PhysicsBody만 연결합니다. 점선은 보이지 않는 충돌 범위를 설명하기 위한 표시입니다.</desc>
  <defs>
    <g id="model-icon" stroke="#1670e8" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 -12 11 -6 11 7 0 13 -11 7 -11 -6Z" fill="#dceaff"/>
      <path d="m-11 -6 11 6 11 -6M0 0v13" fill="none"/>
    </g>
    <g id="collision-icon" fill="none" stroke="#1670e8" stroke-width="2.5">
      <rect x="-12" y="-12" width="24" height="24" rx="3" stroke-dasharray="4 3"/>
      <rect x="-5" y="-5" width="10" height="10" rx="1" fill="#dceaff"/>
    </g>
    <g id="physics-icon" fill="none" stroke="#1670e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -12V8m-6 -6 6 6 6 -6M-11 13h22"/>
    </g>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#fafcff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif">
    <text x="56" y="72" font-size="34" fill="#172b4d">필요한 부품만 조합하기</text>
    <rect x="56" y="126" width="528" height="538" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/>
    <rect x="616" y="126" width="528" height="538" rx="16" fill="#f0f8f3" stroke="#bfd0e5" stroke-width="2"/>
    <g text-anchor="middle" fill="#172b4d" font-size="25">
      <text x="320" y="174">도미노</text>
      <text x="880" y="174">보이지 않는 물리 바닥</text>
    </g>

    <!-- Visible model and its slightly expanded collision bounds. -->
    <ellipse cx="320" cy="400" rx="83" ry="15" fill="#dce6f1"/>
    <path d="M275 239 344 219 369 236 300 256Z" fill="#f27777"/>
    <path d="M275 239 300 256V402L275 385Z" fill="#b93c45"/>
    <path d="M300 256 369 236V383L300 402Z" fill="#e6555f"/>
    <g fill="none" stroke="#1670e8" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round">
      <path d="M266 233 345 210 379 231V390L299 414 266 391Z"/>
      <path d="m266 233 33 23 80 -25M299 256v158"/>
    </g>

    <!-- An unfilled dashed plane denotes invisible collision geometry. -->
    <g fill="none" stroke="#1670e8" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round">
      <path d="m738 337 177 -66 111 66 -177 66Z"/>
      <path d="m797 315 111 66m-52 -88 111 66m-192 0 177 -66m-140 88 177 -66" opacity="0.35"/>
    </g>
    <g stroke="#52677e" stroke-width="3" stroke-linecap="round">
      <path d="M848 404v16m-10 0h20M1026 340v16m-10 0h20"/>
    </g>

    <!-- Each object connects only to the component tiles it contains. -->
    <g fill="none" stroke="#1670e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M320 430v44M158 505v-31h324v31M320 474v31"/>
      <path d="M880 430v44M799 505v-31h162v31"/>
    </g>
    <g fill="#1670e8">
      <circle cx="158" cy="505" r="4"/><circle cx="320" cy="505" r="4"/><circle cx="482" cy="505" r="4"/>
      <circle cx="799" cy="505" r="4"/><circle cx="961" cy="505" r="4"/>
    </g>
    <g fill="#fff" stroke="#bfd0e5" stroke-width="2">
      <rect x="84" y="512" width="148" height="118" rx="14"/>
      <rect x="246" y="512" width="148" height="118" rx="14"/>
      <rect x="408" y="512" width="148" height="118" rx="14"/>
      <rect x="725" y="512" width="148" height="118" rx="14"/>
      <rect x="887" y="512" width="148" height="118" rx="14"/>
    </g>
    <use href="#model-icon" x="158" y="541"/>
    <use href="#collision-icon" x="320" y="541"/>
    <use href="#physics-icon" x="482" y="541"/>
    <use href="#collision-icon" x="799" y="541"/>
    <use href="#physics-icon" x="961" y="541"/>
    <g text-anchor="middle" font-size="20" fill="#172b4d">
      <text x="158" y="580">Model</text><text x="320" y="580">Collision</text><text x="482" y="580">PhysicsBody</text>
      <text x="799" y="580">Collision</text><text x="961" y="580">PhysicsBody</text>
    </g>
    <g text-anchor="middle" font-size="18" fill="#52677e">
      <text x="158" y="608">모양 · 재질</text><text x="320" y="608">충돌</text><text x="482" y="608">dynamic</text>
      <text x="799" y="608">충돌</text><text x="961" y="608">static</text>
    </g>
  </g>
</svg>
