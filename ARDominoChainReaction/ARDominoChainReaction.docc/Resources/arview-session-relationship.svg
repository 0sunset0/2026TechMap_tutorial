<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1670e8"/></marker></defs><rect width="1200" height="720" rx="24" fill="#fafcff"/><g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"><text x="56" y="72" font-size="34" fill="#172b4d">ARView와 ARSession의 관계</text><text x="56" y="114" font-size="21" fill="#52677e">설정을 만든 뒤 세션을 실행하면, 세션이 델리게이트에 알림을 보냅니다.</text><rect x="56" y="330" width="450" height="120" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/><text x="281" y="402" font-size="25" fill="#172b4d" text-anchor="middle">ARWorldTrackingConfiguration</text><rect x="610" y="205" width="430" height="310" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/><text x="636" y="253" font-size="25" fill="#172b4d">ARView</text><text x="636" y="286" font-size="20" fill="#455b75">AR 세션을 담는 뷰</text><rect x="665" y="330" width="330" height="120" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/><text x="830" y="402" font-size="25" fill="#172b4d" text-anchor="middle">session: ARSession</text><path d="M506 390 H654" fill="none" stroke="#1670e8" stroke-width="4" marker-end="url(#arrow)"/><text x="580" y="357" font-size="20" fill="#455b75" text-anchor="middle">session.run(configuration)</text><rect x="665" y="570" width="330" height="100" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/><text x="830" y="628" font-size="25" fill="#172b4d" text-anchor="middle">ARCoordinator</text><path d="M830 450 V559" fill="none" stroke="#1670e8" stroke-width="4" marker-end="url(#arrow)"/><text x="850" y="545" font-size="20" fill="#455b75">delegate · 콜백</text></g></svg>
