name: ARDominoChainReaction
options:
  bundleIdPrefix: com.techmap.ardominochainreaction
  deploymentTarget:
    iOS: "17.0"
targets:
  ARDominoChainReaction:
    type: application
    platform: iOS
    sources:
      - path: Sources/ARDominoChainReaction
    info:
      path: Sources/ARDominoChainReaction/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "AR 도미노 체인리액션에서 ARKit 카메라 트래킹을 사용하기 위해 카메라 접근 권한이 필요합니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techmap.ardominochainreaction.ARDominoChainReaction
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
