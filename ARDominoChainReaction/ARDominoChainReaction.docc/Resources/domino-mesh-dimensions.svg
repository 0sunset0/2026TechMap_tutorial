<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1670e8"/></marker></defs><rect width="1200" height="720" rx="24" fill="#fafcff"/><g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"><text x="56" y="72" font-size="34" fill="#172b4d" text-anchor="start">Mesh · 도미노의 모양</text><text x="56" y="114" font-size="21" fill="#52677e" text-anchor="start">코드의 단위는 미터입니다. 정면의 너비:높이는 2:5입니다.</text><path d="M235 215 l40 -24 h160 l-40 24z" fill="#f4f7fb" stroke="#64748b"/><path d="M395 215 l40 -24 v400 l-40 24z" fill="#a6b8cd" stroke="#64748b"/><rect x="235" y="215" width="160" height="400" fill="#e2eaf3" stroke="#64748b"/><path d="M160 600 L160 215" fill="none" stroke="#1670e8" stroke-width="4" marker-end="url(#arrow)"/><text x="125" y="415" font-size="24" fill="#172b4d" text-anchor="start">Y</text><text x="55" y="460" font-size="20" fill="#172b4d" text-anchor="start">높이 0.2m</text><path d="M235 655 L395 655" fill="none" stroke="#1670e8" stroke-width="4" marker-end="url(#arrow)"/><text x="250" y="695" font-size="20" fill="#172b4d" text-anchor="start">너비 0.08m · X</text><rect x="620" y="220" width="490" height="220" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/><text x="642" y="262" font-size="25" fill="#172b4d" text-anchor="start">generateBox</text><text x="642" y="302" font-size="20" fill="#455b75" text-anchor="start">width: 0.08 → X축 8cm</text><text x="642" y="334" font-size="20" fill="#455b75" text-anchor="start">height: 0.2 → Y축 20cm</text><text x="642" y="366" font-size="20" fill="#455b75" text-anchor="start">depth: 0.04 → Z축 4cm</text><text x="620" y="495" font-size="23" fill="#172b4d" text-anchor="start">원점은 박스의 중심입니다.</text><text x="620" y="535" font-size="23" fill="#172b4d" text-anchor="start">바닥에 놓을 때 높이를 보정합니다.</text></g></svg>