<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1670e8"/></marker></defs><rect width="1200" height="720" rx="24" fill="#fafcff"/><g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"><text x="56" y="72" font-size="34" fill="#172b4d" text-anchor="start">Material · 도미노의 표면</text><text x="56" y="114" font-size="21" fill="#52677e" text-anchor="start">세 값을 설정해 빨간색 비금속 재질을 만듭니다.</text><path d="M155 210 l40 -24 h160 l-40 24z" fill="#f7857b" stroke="#64748b"/><path d="M315 210 l40 -24 v400 l-40 24z" fill="#b72d31" stroke="#64748b"/><rect x="155" y="210" width="160" height="400" fill="#e54d49" stroke="#64748b"/><rect x="470" y="185" width="665" height="125" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/><text x="492" y="227" font-size="25" fill="#172b4d" text-anchor="start">baseColor = .red</text><text x="492" y="267" font-size="20" fill="#455b75" text-anchor="start">표면의 고유색을 빨간색으로 설정</text><rect x="470" y="330" width="665" height="125" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/><text x="492" y="372" font-size="25" fill="#172b4d" text-anchor="start">roughness = 0.4</text><text x="492" y="412" font-size="20" fill="#455b75" text-anchor="start">낮을수록 반사가 또렷하고, 높을수록 흐려짐</text><rect x="470" y="475" width="665" height="125" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/><text x="492" y="517" font-size="25" fill="#172b4d" text-anchor="start">metallic = 0</text><text x="492" y="557" font-size="20" fill="#455b75" text-anchor="start">금속이 아닌 표면으로 설정</text></g></svg>