    <text x="116" y="331" font-size="20" fill="#455b75">모양 로직 + 충돌 로직 + 물리 로직</text>
    <path d="M296 390 V454" fill="none" stroke="#1670e8" stroke-width="4" marker-end="url(#arrow)"/>
