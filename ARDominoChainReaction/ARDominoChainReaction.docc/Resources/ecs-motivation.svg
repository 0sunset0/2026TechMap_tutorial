    <text x="116" y="504" font-size="25" fill="#172b4d">InvisibleFloorClass</text>
    <text x="116" y="547" font-size="20" fill="#455b75">충돌 로직 + 물리 로직을 다시 구성</text>
    <text x="600" y="410" font-size="34" fill="#1670e8" text-anchor="middle">VS</text>
    <rect x="664" y="175" width="480" height="465" rx="16" fill="#eef5ff" stroke="#bfd0e5" stroke-width="2"/>
    <text x="690" y="218" font-size="25" fill="#172b4d">ECS</text>
