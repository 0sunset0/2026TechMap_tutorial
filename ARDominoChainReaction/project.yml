include:
  - path: app-project.yml
options:
  preGenCommand: python3 Docs/Tools/prepare_xcode_english.py
targets:
  ARDominoChainReaction-English:
    type: application
    platform: iOS
    sources:
      - path: English/Generated/Sources/ARDominoChainReaction
      - path: English/Generated/ARDominoChainReaction.docc
    info:
      path: English/Generated/Sources/ARDominoChainReaction/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Camera access is required for ARKit camera tracking in AR Domino Chain Reaction."
        UIRequiredDeviceCapabilities: [arkit]
    preBuildScripts:
      - name: Prepare English documentation and app strings
        script: python3 "$SRCROOT/Docs/Tools/prepare_xcode_english.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techmap.ardominochainreaction.ARDominoChainReaction.english
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
